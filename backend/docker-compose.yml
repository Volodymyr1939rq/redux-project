version: '3.8'

services:
       redis:
           container_name: redis
           image: redis:7-alpine
           restart: always
           ports: 
             - 6379:6379
           command: redis-server --requirepass ${REDIS_PASSWORD}
           volumes:
             - redis_data:/data
           networks:
             - backend

volumes:
  redis_data:

networks:
  backend:


